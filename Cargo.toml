[package]
name = "wallset"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
directories = "6.0"
image = { version = "0.25", default-features = false, features = ["bmp"] }
rand = "0.9"
rfd = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = "1.17"
thiserror = "2.0"
winreg = "0.55"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
] }

[build-dependencies]
slint-build = "1.17"
